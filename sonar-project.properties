# SonarQube Cloud analysis of flightboard, run by the sonar job in .github/workflows/ci.yml.
sonar.organization=git-demo-projectx
sonar.projectKey=git-demo-projectx_flightboard-vortex
sonar.projectName=flightboard-vortex

sonar.sources=api,web/src,pay/src,pay/public
sonar.tests=api,web/src,pay/tests
sonar.test.inclusions=api/**/*_test.go,web/src/**/*.test.ts,web/src/**/*.test.tsx,pay/tests/**
sonar.exclusions=api/**/*_test.go,api/**/testdata/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**

sonar.go.coverage.reportPaths=api/coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.php.coverage.reportPaths=pay/coverage/clover.xml

# Fail the CI job when the quality gate fails, so the factory sees it.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
